[package]
name = "gitswitch"
version = "1.8.0"
description = "GitSwitch — Precision Offline-First Git & SSH Identity Switcher"
authors = ["GitSwitch"]
edition = "2021"

[lib]
name = "gitswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"

